name: Check iOS app
on:
  push:
    branches: [ios]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator app
        run: >-
          xcodebuild -project ios/LAXCommute.xcodeproj -scheme LAXCommute
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run native unit tests
        shell: bash
        run: |
          LAX_SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v.get("isAvailable") and "iPhone" in v["name"]))')
          xcodebuild -project ios/LAXCommute.xcodeproj -scheme LAXCommute -destination "platform=iOS Simulator,id=$LAX_SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO test
