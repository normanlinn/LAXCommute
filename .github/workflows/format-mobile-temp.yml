name: Format mobile patch (temporary)
on:
  push:
    branches: [fix/mobile-inline-commute-20261020]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/App.tsx
      - name: Print formatted App
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('src/App.tsx').toString('base64');
          console.log('FORMATTED_BEGIN src/App.tsx');
          for (let i = 0; i < source.length; i += 120) console.log(source.slice(i, i + 120));
          console.log('FORMATTED_END src/App.tsx');
          NODE
