name: Format arrival fix (temporary)
on:
  push:
    branches: [fix/arrival-next-loop-and-clean-data-flow]
    paths: [.github/workflows/format-arrivals-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arrival-next-loop-and-clean-data-flow
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write README.md src/components/Arrivals.tsx src/domain/arrivals.ts tests/arrivals-ui.test.jsx tests/arrivals.test.js
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/components/Arrivals.tsx src/domain/arrivals.ts tests/arrivals-ui.test.jsx tests/arrivals.test.js
          if ! git diff --cached --quiet; then
            git commit -m "Format arrival logic and regression tests"
            git push origin HEAD:refs/heads/fix/arrival-next-loop-and-clean-data-flow
          fi
