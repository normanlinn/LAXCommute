name: Format transit map branch (one-time)
on:
  push:
    branches: [feat/transit-map-experience]
    paths:
      - .github/workflows/format-transit-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/transit-map-experience
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write .
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Apply Prettier formatting across LAXCommute"
            git push origin HEAD:refs/heads/feat/transit-map-experience
          fi
