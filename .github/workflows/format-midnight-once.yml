name: Format Midnight Blue test
on:
  push:
    branches: [design/midnight-blue-dark-mode]
    paths:
      - .github/workflows/format-midnight-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/midnight-blue-dark-mode
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/contrast.test.js
      - name: Commit formatted regression test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/contrast.test.js
          if ! git diff --cached --quiet; then
            git commit -m "Format Midnight Blue backdrop regression test"
            git push origin HEAD:refs/heads/design/midnight-blue-dark-mode
          fi
