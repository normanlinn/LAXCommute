name: Format mobile map patch
on:
  push:
    branches: [fix/mobile-centered-round-buses]
    paths:
      - .github/workflows/format-mobile-map-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-centered-round-buses
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/FreeMap.tsx
      - name: Commit formatted map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FreeMap.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Format centered map component"
            git push origin HEAD:refs/heads/fix/mobile-centered-round-buses
          fi
