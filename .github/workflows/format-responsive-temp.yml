name: Format responsive changes (temporary)
on:
  push:
    branches: [feat/responsive-commute-sheet-20261019]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/App.tsx tests/ui.test.jsx
      - name: Print formatted source
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const f of ['src/App.tsx', 'tests/ui.test.jsx']) {
            console.log('FORMATTED_BEGIN ' + f);
            const bytes = fs.readFileSync(f).toString('base64');
            for (let i = 0; i < bytes.length; i += 120) console.log(bytes.slice(i, i + 120));
            console.log('FORMATTED_END ' + f);
          }
          NODE
