name: One-time community function formatting
on:
  push:
    branches: [fix/midnight-interactions-and-community-cors]
    paths: [.github/workflows/format-community-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/midnight-interactions-and-community-cors
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write supabase/functions/community/index.ts
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/community/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format community function source"
            git push origin HEAD:refs/heads/fix/midnight-interactions-and-community-cors
          fi
